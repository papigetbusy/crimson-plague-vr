# On every push to main: guard + referee tests, build the page, publish to GitHub Pages.
# Anything red stops everything; the last good version stays live.
name: Test, build and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Architecture guard
        run: node tools/guard.js
      - name: Referee tests
        run: node tests/referee.test.js
      - name: Model checks
        run: node tests/models.test.js
      - name: Core loop checks
        run: node tests/loop.test.js
      - name: Controller checks
        run: node tests/pad.test.js
      - name: Meta Quest controller checks
        run: node tests/xr.test.js
      - name: VR grab and door checks
        run: node tests/grab.test.js
      - name: VR game flow and menu checks
        run: node tests/vrflow.test.js
      - name: VR gun feel checks
        run: node tests/feel.test.js
      - name: Touch button settings checks
        run: node tests/touch.test.js
      - name: Effect checks
        run: node tests/fx.test.js
      - name: Gun look checks
        run: node tests/gun.test.js
      - name: Ember Rifle checks
        run: node tests/ember.test.js
      - name: Revolver checks
        run: node tests/revolver.test.js
      - name: Gun catalog checks (20 guns)
        run: node tests/guns.test.js
      - name: Weapon checks (pistol start, two guns, rarity, drops)
        run: node tests/weapons.test.js
      - name: Gun affix checks (counts by rarity, class-only lines, floor card)
        run: node tests/affixes.test.js
      - name: Gear checks (armor, charms, drops, Gear menu)
        run: node tests/gear.test.js
      - name: Codex checks (everything explained, search)
        run: node tests/codex.test.js
      - name: Gun mod checks (lines, fit rules, mod places, bag)
        run: node tests/mods.test.js
      - name: Stash and blueprint checks
        run: node tests/stash.test.js
      - name: Seeds and saves checks
        run: node tests/saves.test.js
      - name: Never-stuck checks (level-ups, shop, random play)
        run: node tests/stuck.test.js
      - name: Floor gun model checks
        run: node tests/floorguns.test.js
      - name: Gold trail checks
        run: node tests/trail.test.js
      - name: Boss checks
        run: node tests/bosses.test.js
      - name: Co-op checks
        run: node tests/coop.test.js
      - name: Gun status effect checks
        run: node tests/gunfx.test.js
      - name: Hall look tests
        run: node tests/world.test.js
      - name: Floor tests
        run: node tests/floor.test.js
      - name: Monster tests
        run: node tests/monsters.test.js
      - name: Monster rig tests
        run: node tests/rigs.test.js
      - name: Elite and past-the-cap tests
        run: node tests/elites.test.js
      - name: Class tests
        run: node tests/classes.test.js
      - name: Fog tests
        run: node tests/fog.test.js
      - name: Shop tests
        run: node tests/shop.test.js
      - name: Trap tests
        run: node tests/traps.test.js
      - name: Build the page
        run: node tools/build.js "build-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
      - name: Publish previews and models
        run: |
          [ -d preview ] && cp -r preview site/preview || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
